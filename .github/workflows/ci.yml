name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_MAP_TEST_API: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e
      # Keep the diagnostic camera API out of the ordinary production output.
      - run: env -u NEXT_PUBLIC_MAP_TEST_API npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: oa-reserve-publication-evidence
          path: |
            test-results/oa-reserve-*.png
            .next/server/app/**/cpf-oa-reserve-for-bto.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
